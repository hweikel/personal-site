<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Shorts Mini Film Festival</title>
<style>
  @font-face {
    font-family: 'IM Fell English';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('../fonts/im-fell-english-400.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    font-family: 'IM Fell English', Georgia, serif;
    color: #b3181d;
    text-align: center;
  }

  .title {
    font-size: 2rem;
    font-weight: normal;
    letter-spacing: 0.08em;
    line-height: 1.3;
    margin-bottom: 1.5rem;
  }

  img {
    width: min(340px, 90vw);
    display: block;
    margin-bottom: 1.5rem;
  }

  .details {
    font-size: 1.25rem;
    line-height: 1.9;
    margin-bottom: 1.5rem;
  }

  .description {
    font-size: 1.25rem;
    line-height: 1.9;
    opacity: 0.85;
    max-width: 34ch;
    margin-bottom: 1.5rem;
  }
</style>
</head>
<body>
  <p class="title">Animated Shorts<br>Mini Film Festival</p>
  <img src="quay.jpg" alt="The Brothers Quay at work on Street of Crocodiles">
  <p class="details">Sunday, July 26<br>Snacks 7pm onwards, films start 8pm</p>
  <p class="description">Showing a mix of animated shorts by <b>Masaaki Yuasa</b>, <b>The Brothers Quay</b>, <b>Jan Svankmajer</b>, <b>Yuri Norstein</b>, and more. Open to suggestions!</p>
  <p class="details">1082 Pennsylvania Ave #303<br>805 331 5513</p>
</body>
</html>
